basePath: /
definitions:
  gitprovider.Branch:
    properties:
      is_default:
        type: boolean
      name:
        type: string
    type: object
  gitprovider.ProviderStatus:
    properties:
      available:
        type: boolean
      type:
        type: string
    type: object
  handlers.BulkOperationRequest:
    properties:
      instance_ids:
        items:
          type: string
        type: array
    required:
    - instance_ids
    type: object
  handlers.BulkOperationResponse:
    properties:
      failed:
        type: integer
      results:
        items:
          $ref: '#/definitions/handlers.BulkOperationResultItem'
        type: array
      succeeded:
        type: integer
      total:
        type: integer
    type: object
  handlers.BulkOperationResultItem:
    properties:
      error:
        type: string
      instance_id:
        type: string
      instance_name:
        type: string
      log_id:
        type: string
      status:
        type: string
    type: object
  handlers.BulkTemplateRequest:
    properties:
      template_ids:
        items:
          type: string
        type: array
    required:
    - template_ids
    type: object
  handlers.BulkTemplateResponse:
    properties:
      failed:
        type: integer
      results:
        items:
          $ref: '#/definitions/handlers.BulkTemplateResultItem'
        type: array
      succeeded:
        type: integer
      total:
        type: integer
    type: object
  handlers.BulkTemplateResultItem:
    properties:
      error:
        type: string
      status:
        description: '"success" or "error"'
        type: string
      template_id:
        type: string
      template_name:
        type: string
    type: object
  handlers.CLIAuthRequest:
    properties:
      redirect_uri:
        type: string
    type: object
  handlers.CLITokenRequest:
    properties:
      session_id:
        type: string
    required:
    - session_id
    type: object
  handlers.ChangeRoleRequest:
    properties:
      role:
        description: 'Role is the new role: "user", "devops" or "admin".'
        enum:
        - user
        - devops
        - admin
        example: devops
        type: string
    required:
    - role
    type: object
  handlers.ChangeRoleResponse:
    properties:
      changed:
        description: |-
          Changed is false when the user already had the role (no-op: the
          sessions of the user stay valid).
        type: boolean
      id:
        type: string
      message:
        type: string
      new_role:
        type: string
      old_role:
        type: string
    type: object
  handlers.ChartConfigExportData:
    properties:
      build_pipeline_id:
        type: string
      chart_name:
        type: string
      chart_path:
        type: string
      chart_version:
        type: string
      default_values:
        type: string
      deploy_order:
        type: integer
      repository_url:
        type: string
      source_repo_url:
        type: string
    type: object
  handlers.ChartDeployPreview:
    properties:
      chart_name:
        type: string
      has_changes:
        type: boolean
      pending_values:
        type: string
      previous_values:
        type: string
    type: object
  handlers.CloneInstanceResponse:
    properties:
      branch:
        type: string
      cluster_id:
        type: string
      cluster_name:
        description: |-
          ClusterName is the name of the target cluster. Omitted when the
          cluster no longer exists or cluster_id is empty (older instances).
        readOnly: true
        type: string
      created_at:
        type: string
      definition_name:
        description: |-
          DefinitionName is the name of the stack definition. Omitted when the
          definition no longer exists.
        readOnly: true
        type: string
      error_message:
        type: string
      expires_at:
        type: string
      follower_count:
        readOnly: true
        type: integer
      following:
        description: |-
          Following and FollowerCount are computed, not stored. Only GET
          /stack-instances/{id} sets them: following is true when the caller
          follows the instance, follower_count is the number of followers.
        readOnly: true
        type: boolean
      id:
        type: string
      last_deployed_at:
        type: string
      name:
        type: string
      namespace:
        type: string
      owner_id:
        type: string
      owner_username:
        description: |-
          OwnerUsername is the username of the owner. Omitted when the owner
          no longer exists (for example, after a delete).
        readOnly: true
        type: string
      stack_definition_id:
        type: string
      status:
        type: string
      stopped_at:
        description: |-
          StoppedAt is the time the last successful stop finished. It is nil
          when the instance is not stopped. A deploy or a clean clears it.
          Cleanup policies use it for the stopped_days condition.
        type: string
      ttl_minutes:
        type: integer
      updated_at:
        type: string
      values_drift:
        description: |-
          ValuesDrift is computed, not stored. GET /stack-instances/{id} sets it
          to true when the running values come from a successful rollback and
          the stored overrides produce different values (the next deploy undoes
          the rollback). List responses do not compute it.
        type: boolean
      warning:
        description: |-
          Warning is set when the clone did not get the quota override of the
          source (above the cluster quota, or the cluster quota lookup failed).
          The clone then uses the cluster quota.
        type: string
    type: object
  handlers.ClusterSummary:
    properties:
      id:
        type: string
      is_default:
        type: boolean
      name:
        type: string
    type: object
  handlers.ClusterUtilization:
    properties:
      cluster_id:
        type: string
      namespaces:
        items:
          $ref: '#/definitions/handlers.NamespaceResourceUsage'
        type: array
    type: object
  handlers.CompareChartDiff:
    properties:
      chart_name:
        type: string
      has_differences:
        type: boolean
      left_values:
        type: string
      right_values:
        type: string
    type: object
  handlers.CompareInstanceSummary:
    properties:
      branch:
        type: string
      definition_name:
        type: string
      id:
        type: string
      name:
        type: string
      owner:
        type: string
    type: object
  handlers.CompareInstancesResponse:
    properties:
      charts:
        items:
          $ref: '#/definitions/handlers.CompareChartDiff'
        type: array
      left:
        $ref: '#/definitions/handlers.CompareInstanceSummary'
      right:
        $ref: '#/definitions/handlers.CompareInstanceSummary'
    type: object
  handlers.CreateAPIKeyRequest:
    properties:
      expires_at:
        type: string
      expires_in_days:
        type: integer
      name:
        type: string
    required:
    - name
    type: object
  handlers.CreateAPIKeyResponse:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      name:
        type: string
      prefix:
        type: string
      raw_key:
        description: sk_<hex> — shown once, store securely
        type: string
    type: object
  handlers.CreateClusterRequest:
    properties:
      api_server_url:
        type: string
      description:
        type: string
      image_pull_secret_name:
        type: string
      is_default:
        type: boolean
      kubeconfig_data:
        type: string
      kubeconfig_path:
        type: string
      max_instances_per_user:
        type: integer
      max_namespaces:
        type: integer
      name:
        type: string
      region:
        type: string
      registry_password:
        type: string
      registry_url:
        type: string
      registry_username:
        type: string
      use_in_cluster:
        type: boolean
    required:
    - name
    type: object
  handlers.DashboardCluster:
    properties:
      allocatable_cpu:
        type: string
      allocatable_memory:
        type: string
      health_status:
        type: string
      id:
        type: string
      name:
        type: string
      namespace_count:
        type: integer
      node_count:
        type: integer
      ready_node_count:
        type: integer
      total_cpu:
        type: string
      total_memory:
        type: string
    type: object
  handlers.DashboardDeployment:
    properties:
      action:
        type: string
      completed_at:
        type: string
      id:
        type: string
      instance_name:
        type: string
      owner_username:
        type: string
      stack_instance_id:
        type: string
      started_at:
        type: string
      status:
        type: string
    type: object
  handlers.DashboardExpiring:
    properties:
      cluster_id:
        type: string
      expires_at:
        type: string
      id:
        type: string
      name:
        type: string
      namespace:
        type: string
      owner_id:
        type: string
      status:
        type: string
      ttl_minutes:
        type: integer
    type: object
  handlers.DashboardFailing:
    properties:
      cluster_id:
        type: string
      error_message:
        type: string
      id:
        type: string
      name:
        type: string
      namespace:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  handlers.DashboardResponse:
    properties:
      clusters:
        items:
          $ref: '#/definitions/handlers.DashboardCluster'
        type: array
      expiring_soon:
        items:
          $ref: '#/definitions/handlers.DashboardExpiring'
        type: array
      failing_instances:
        items:
          $ref: '#/definitions/handlers.DashboardFailing'
        type: array
      recent_deployments:
        items:
          $ref: '#/definitions/handlers.DashboardDeployment'
        type: array
    type: object
  handlers.DefinitionExportBundle:
    properties:
      charts:
        items:
          $ref: '#/definitions/handlers.ChartConfigExportData'
        type: array
      definition:
        $ref: '#/definitions/handlers.DefinitionExportData'
      exported_at:
        type: string
      schema_version:
        type: string
    type: object
  handlers.DefinitionExportData:
    properties:
      default_branch:
        type: string
      description:
        type: string
      name:
        type: string
    type: object
  handlers.DefinitionWithChartsResponse:
    properties:
      chart_count:
        description: |-
          ChartCount is the number of charts. It is computed, not stored; the
          paged list sets it (the list does not load the charts).
        readOnly: true
        type: integer
      charts:
        items:
          $ref: '#/definitions/models.ChartConfig'
        type: array
      created_at:
        type: string
      default_branch:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      owner_id:
        type: string
      owner_instance_id:
        description: |-
          OwnerInstanceID is set when quick deploy created the definition for one
          instance. Deleting that instance also deletes the definition when no
          other instance uses it. Empty for definitions that users create.
        type: string
      owner_username:
        description: |-
          OwnerUsername is the username of the owner. It is computed, not
          stored; the API sets it in list and detail responses. Omitted when
          the owner no longer exists (for example, after a delete).
        readOnly: true
        type: string
      source_template_id:
        type: string
      source_template_version:
        type: string
      updated_at:
        type: string
    type: object
  handlers.DeployPreviewResponse:
    properties:
      charts:
        items:
          $ref: '#/definitions/handlers.ChartDeployPreview'
        type: array
      instance_id:
        type: string
      instance_name:
        type: string
      values_drift:
        description: |-
          ValuesDrift is true when the running values come from a rollback (the
          last operation was a successful rollback) and the stored overrides
          produce different values: the next deploy undoes the rollback.
        type: boolean
      warning:
        description: Warning explains ValuesDrift when it is true.
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handlers.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  handlers.NamespaceConflictResponse:
    properties:
      error:
        type: string
      message:
        type: string
      suggestions:
        items:
          type: string
        type: array
    type: object
  handlers.NamespaceResourceUsage:
    properties:
      cpu_limit:
        type: string
      cpu_used:
        type: string
      memory_limit:
        type: string
      memory_used:
        type: string
      namespace:
        type: string
      pod_count:
        type: integer
      pod_limit:
        type: integer
    type: object
  handlers.OrphanedNamespaceResponse:
    properties:
      created_at:
        type: string
      helm_releases:
        items:
          type: string
        type: array
      managed:
        description: |-
          Managed is true when the namespace has the label
          managed-by=k8s-stack-manager. An unmanaged namespace can belong to
          another team or tool; deleting it requires ?confirm=<namespace>.
        type: boolean
      name:
        type: string
      phase:
        type: string
      resource_counts:
        $ref: '#/definitions/k8s.ResourceCounts'
    type: object
  handlers.OverviewStats:
    properties:
      running_instances:
        type: integer
      total_definitions:
        type: integer
      total_deploys:
        type: integer
      total_instances:
        type: integer
      total_templates:
        type: integer
      total_users:
        type: integer
    type: object
  handlers.RefreshResponse:
    properties:
      token:
        type: string
    type: object
  handlers.RegisterRequest:
    properties:
      display_name:
        type: string
      password:
        type: string
      role:
        type: string
      service_account:
        type: boolean
      username:
        type: string
    required:
    - password
    - username
    type: object
  handlers.ResetPasswordRequest:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  handlers.RollbackResponse:
    properties:
      log_id:
        type: string
      message:
        type: string
      target_log_id:
        description: |-
          TargetLogID is the deploy whose values the rollback restores. Empty
          for a rollback by one Helm revision.
        type: string
      values_drift:
        description: |-
          ValuesDrift is set for a rollback to a target: true when the values
          built from the stored overrides differ from the target values. The
          rollback does not change the stored overrides, so the next deploy then
          changes the running values again. Not set for a rollback by one
          revision; use GET /deploy-preview after the rollback.
        type: boolean
      warning:
        description: Warning explains ValuesDrift when it is true.
        type: string
    type: object
  handlers.TemplateDetailResponse:
    properties:
      category:
        type: string
      charts:
        items:
          $ref: '#/definitions/models.TemplateChartConfig'
        type: array
      created_at:
        type: string
      default_branch:
        type: string
      description:
        type: string
      has_unpublished_changes:
        type: boolean
      id:
        type: string
      is_published:
        type: boolean
      name:
        type: string
      owner_id:
        type: string
      owner_username:
        description: |-
          OwnerUsername is the username of the owner. It is computed, not
          stored; the API sets it in list and detail responses. Omitted when
          the owner no longer exists (for example, after a delete).
        readOnly: true
        type: string
      published_charts:
        description: |-
          PublishedCharts are the charts of the latest snapshot: what Use
          Template and Quick Deploy apply. The IDs are the template chart config
          IDs at publish time; Use Template accepts them as chart_overrides keys.
          Null when the template has no snapshot.
        items:
          $ref: '#/definitions/models.TemplateChartConfig'
        type: array
      published_version:
        type: string
      published_version_id:
        type: string
      updated_at:
        type: string
      version:
        type: string
    type: object
  handlers.TemplateStats:
    properties:
      category:
        type: string
      definition_count:
        type: integer
      deploy_count:
        type: integer
      error_count:
        type: integer
      instance_count:
        type: integer
      is_published:
        type: boolean
      success_count:
        type: integer
      success_rate:
        type: number
      template_id:
        type: string
      template_name:
        type: string
    type: object
  handlers.UIConfigResponse:
    properties:
      favicon_url:
        description: FaviconURL is the browser tab icon (APP_FAVICON_URL).
        example: /favicon.svg
        type: string
      logo_url:
        description: 'LogoURL is the logo image (APP_LOGO_URL). Empty: the built-in
          logo.'
        example: ""
        type: string
      title:
        description: Title is the product name (APP_TITLE).
        example: K8s Stack Manager
        type: string
    type: object
  handlers.UpdateClusterRequest:
    properties:
      api_server_url:
        type: string
      description:
        type: string
      image_pull_secret_name:
        type: string
      is_default:
        type: boolean
      kubeconfig_data:
        type: string
      kubeconfig_path:
        type: string
      max_instances_per_user:
        type: integer
      max_namespaces:
        type: integer
      name:
        type: string
      region:
        type: string
      registry_password:
        type: string
      registry_url:
        type: string
      registry_username:
        type: string
      use_in_cluster:
        type: boolean
    type: object
  handlers.UpdateQuotaRequest:
    properties:
      cpu_limit:
        type: string
      cpu_request:
        type: string
      memory_limit:
        type: string
      memory_request:
        type: string
      pod_limit:
        type: integer
      storage_limit:
        type: string
    type: object
  handlers.UserStats:
    properties:
      deploy_count:
        type: integer
      instance_count:
        type: integer
      last_active:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  handlers.ValidateBranchResponse:
    properties:
      branch:
        description: Branch is the branch name from the request.
        example: main
        type: string
      valid:
        description: Valid is true when the branch exists in the repository.
        example: true
        type: boolean
    type: object
  handlers.actionInfo:
    properties:
      can_invoke:
        description: CanInvoke is true when the caller may run the action on this
          instance.
        type: boolean
      confirm:
        type: string
      description:
        type: string
      has_job_log:
        description: |-
          HasJobLog is true when the backend proxies the job log of the action
          (the action config has a log_path).
        type: boolean
      label:
        type: string
      name:
        type: string
      parameters:
        items:
          $ref: '#/definitions/handlers.actionParameterInfo'
        type: array
    type: object
  handlers.actionJobLogResponse:
    properties:
      action:
        type: string
      done:
        description: Done is true when the job has ended and the log is read to the
          end.
        type: boolean
      instance_id:
        type: string
      job_id:
        type: string
      log:
        description: Log is the log text from Offset to NextOffset.
        type: string
      next_offset:
        description: NextOffset is the offset for the next poll.
        type: integer
      offset:
        description: Offset is the requested byte offset.
        type: integer
      status:
        description: |-
          Status is the job state from the subscriber: running while the job
          runs, else a final state such as succeeded or failed.
        type: string
      truncated:
        description: |-
          Truncated is true when the chunk was cut at the size cap; poll again
          at once with next_offset.
        type: boolean
    type: object
  handlers.actionListResponse:
    properties:
      actions:
        items:
          $ref: '#/definitions/handlers.actionInfo'
        type: array
      can_invoke:
        type: boolean
      instance_id:
        type: string
    type: object
  handlers.actionParameterInfo:
    properties:
      default: {}
      description:
        type: string
      label:
        type: string
      name:
        type: string
      options:
        items:
          type: string
        type: array
      required:
        type: boolean
      type:
        enum:
        - string
        - bool
        - enum
        type: string
    type: object
  handlers.addFavoriteRequest:
    properties:
      entity_id:
        type: string
      entity_type:
        type: string
    type: object
  handlers.chartConfigUpdateRequest:
    properties:
      build_pipeline_id:
        type: string
      chart_name:
        type: string
      chart_path:
        type: string
      chart_version:
        type: string
      default_values:
        type: string
      deploy_order:
        type: integer
      repository_url:
        type: string
      source_repo_url:
        type: string
    type: object
  handlers.chartDiffEntry:
    properties:
      change_type:
        description: '"added", "removed", "modified", "unchanged"'
        type: string
      chart_name:
        type: string
      has_differences:
        type: boolean
      left_chart_path:
        type: string
      left_chart_version:
        description: |-
          Chart source fields; compared only when both sides store them
          (snapshot schema version 1 or the working copy).
        type: string
      left_locked:
        type: string
      left_repo_url:
        type: string
      left_required:
        type: boolean
      left_sort_order:
        type: integer
      left_values:
        type: string
      right_chart_path:
        type: string
      right_chart_version:
        type: string
      right_locked:
        type: string
      right_repo_url:
        type: string
      right_required:
        type: boolean
      right_sort_order:
        type: integer
      right_values:
        type: string
    type: object
  handlers.cloneInstanceRequest:
    properties:
      branch:
        description: 'Branch of the clone. Default: the branch of the source.'
        type: string
      name:
        description: |-
          Name of the clone. Must be a DNS label (lowercase a-z, 0-9, '-', start
          and end alphanumeric, at most 50 characters). When empty, the server
          picks the first free name of <source>-copy, <source>-copy-2, ...
        type: string
      ttl_minutes:
        description: 'TTLMinutes of the clone (0 = no expiry). Default: the TTL of
          the source.'
        type: integer
    type: object
  handlers.cloneTemplateRequest:
    properties:
      name:
        description: 'Name of the clone. Default: "<source name> (Copy)".'
        type: string
    type: object
  handlers.createChannelRequest:
    properties:
      enabled:
        type: boolean
      filters:
        allOf:
        - $ref: '#/definitions/models.NotificationChannelFilters'
        description: |-
          Filters limits the channel to some stack instances. Omit it or send
          empty lists for all instances.
      name:
        type: string
      secret:
        type: string
      webhook_url:
        type: string
    required:
    - name
    - webhook_url
    type: object
  handlers.createTemplateRequest:
    properties:
      category:
        type: string
      charts:
        items:
          $ref: '#/definitions/models.TemplateChartConfig'
        type: array
      default_branch:
        type: string
      description:
        type: string
      is_published:
        type: boolean
      name:
        type: string
      version:
        type: string
    required:
    - name
    type: object
  handlers.extendTTLRequest:
    properties:
      minutes:
        description: |-
          Minutes adds this many minutes to the current expiry (or to now when
          the instance already expired or has no expiry time). Must be > 0.
        type: integer
      ttl_minutes:
        description: |-
          TTLMinutes is deprecated. Sent alone, it keeps the old behaviour: set
          the TTL to this value and the expiry to now + TTL. Use minutes instead.
        type: integer
    type: object
  handlers.followStateResponse:
    properties:
      follower_count:
        description: FollowerCount is the number of users who follow the instance.
        type: integer
      following:
        description: Following is true when the caller follows the instance.
        type: boolean
    type: object
  handlers.instantiateTemplateRequest:
    properties:
      chart_overrides:
        additionalProperties:
          type: string
        description: |-
          ChartOverrides replace the default values of charts in the new
          definition. Key: a published_charts[].id, a working copy charts[].id
          (mapped by chart name) or a chart name. Keys for charts that are not in
          the published snapshot are ignored.
        type: object
      description:
        type: string
      name:
        type: string
    type: object
  handlers.invokeActionRequest:
    properties:
      parameters:
        additionalProperties: {}
        type: object
