  /api/v1/stack-instances/{id}/clone:
    post:
      consumes:
      - application/json
      description: |-
        Create a new draft stack instance as a copy of an existing one. The clone belongs to the caller and uses the cluster and definition of the source.
        It copies the TTL (unless ttl_minutes is given), the value overrides and the branch overrides. It copies the instance quota override only when the caller owns the source or is admin or devops; for an owner without the admin or devops role only when the override stays within the cluster quota. When it is not copied for that reason (or the cluster quota lookup fails), the response has a warning and the clone uses the cluster quota.
        The body is optional. Without a name, the server picks the first free name of <source>-copy, <source>-copy-2, ... (the namespace stack-<name>-<owner> must be free). A given name must be a DNS label (lowercase a-z, 0-9, '-', start and end alphanumeric, at most 50 characters).
      parameters:
      - description: Source instance ID
        in: path
        name: id
        required: true
        type: string
      - description: Optional clone name, branch and TTL
        in: body
        name: body
        schema:
          $ref: '#/definitions/handlers.cloneInstanceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.CloneInstanceResponse'
        "400":
          description: Invalid body, name or TTL
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Namespace already exists (given name), or no free generated
            name
          schema:
            $ref: '#/definitions/handlers.NamespaceConflictResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Clone a stack instance
      tags:
      - stack-instances
