    post:
      consumes:
      - application/json
      description: 'Import a stack definition from a portable JSON bundle, creating
        a new definition with fresh IDs. Definition names are unique per owner: when
        the caller already has a definition with the bundle name, the import uses
        "<name> (imported)", then "<name> (imported 2)", ... The response holds the
        final name (409 when no free name is found).'
      parameters:
      - description: Export bundle
        in: body
        name: bundle
        required: true
        schema:
          $ref: '#/definitions/handlers.DefinitionExportBundle'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.DefinitionWithChartsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Import a stack definition
      tags:
      - stack-definitions
  /api/v1/stack-instances:
    get:
      description: |-
        List stack instances with server-side pagination, newest first. Supports page/pageSize or legacy limit/offset params.
        The filters name, status, cluster_id, definition_id and owner combine (AND). total is the number of instances that match the filters.
        owner is "me" (the authenticated user), a username, or a user ID. A value in UUID form is matched as a user ID first, then as a username. An unknown username or ID gives an empty list.
        The list is paged (default pageSize 25); with owner=me or name the total is the real number of matches, not the page size.
        Each instance includes owner_username, definition_name and cluster_name. A field is omitted when the owner, definition or cluster no longer exists; cluster_name is also omitted when cluster_id is empty (older instances).
      parameters:
      - description: 'Filter by owner: ''me'', a username, or a user ID'
        in: query
        name: owner
        type: string
      - description: Filter by exact instance name
        in: query
        name: name
        type: string
      - description: Filter by status
        enum:
        - draft
        - queued
        - deploying
        - stabilizing
        - running
        - stopping
        - stopped
        - cleaning
        - partial
        - error
        in: query
        name: status
        type: string
      - description: Filter by cluster ID
        in: query
        name: cluster_id
        type: string
      - description: Filter by stack definition ID
        in: query
        name: definition_id
        type: string
      - description: 'Page number (1-based, default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Results per page (default: 25, max: 100)'
        in: query
        name: pageSize
        type: integer
      - description: 'Legacy: maximum number of results'
        in: query
        name: limit
        type: integer
      - description: 'Legacy: number of results to skip'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'data: []StackInstance, total: int, page: int, pageSize: int'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Unknown status, or a filter value that is too long
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: owner=me without an authenticated user
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List stack instances
      tags:
      - stack-instances
  /api/v1/stack-instances/{id}:
    delete:
      description: Deletes a stack instance. If the instance has running resources
        (status running/stopped/error), a cleanup is initiated first — helm releases
        are uninstalled and the namespace is deleted before the database record is
        removed. Returns 204 for immediate deletion (draft instances) or 202 when
        async cleanup is required. When quick deploy created the stack definition
        of the instance (owner_instance_id) and no other instance uses it, the definition
        and its charts are deleted with the instance.
      parameters:
      - description: Instance ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Cleanup initiated, instance will be deleted after resources
            are removed
          schema:
            additionalProperties:
              type: string
            type: object
        "204":
          description: No Content — instance deleted immediately (no resources to
            clean)
        "403":
          description: Caller is not the owner, an admin or a devops user, or a pre-instance-delete
            hook rejected the request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Instance is in a transient state (deploying/stopping/cleaning)
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Deploy manager not configured
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a stack instance
      tags:
      - stack-instances
    get:
      description: 'Get a stack instance by ID. values_drift is true when the running
        values come from a successful rollback and the stored overrides produce different
        values: the next deploy undoes the rollback. Only this endpoint computes values_drift,
        following (the caller follows the instance) and follower_count; list responses
        omit them. owner_username, definition_name and cluster_name are omitted when
        the owner, definition or cluster no longer exists; cluster_name is also omitted
        when cluster_id is empty (older instances).'
      parameters:
      - description: Instance ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.StackInstance'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a stack instance
      tags:
      - stack-instances
    put:
      consumes:
      - application/json
      description: Update a stack instance (branch, name, etc.). A changed name must
        be a DNS label (lowercase a-z, 0-9, '-', start and end alphanumeric, at most
        50 characters); an unchanged name is not checked, so older instances with
        other names stay editable. A rename does not change the namespace.
      parameters:
      - description: Instance ID
        in: path
        name: id
        required: true
        type: string
      - description: Instance object
        in: body
        name: instance
        required: true
        schema:
          $ref: '#/definitions/models.StackInstance'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.StackInstance'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Caller is not the owner, an admin or a devops user
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a stack instance
      tags:
      - stack-instances
  /api/v1/stack-instances/{id}/actions:
    get:
      consumes:
      - application/json
      description: Returns the registered actions with their UI metadata (label, description,
        confirmation text, parameter schema) and a can_invoke flag. Any authenticated
        user who can view the instance gets the list; can_invoke is true for the owner,
        an admin and a devops user. The response never contains the subscriber URL,
        secret or headers. Without an action registry the list is empty.
      parameters:
      - description: Instance ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.actionListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Instance not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List the actions that can run on a stack instance
      tags:
      - stack-instances
  /api/v1/stack-instances/{id}/actions/{name}:
    post:
      consumes:
      - application/json
      description: 'Dispatches to the action subscriber webhook and wraps its response
        in an envelope containing action, instance_id, status_code, and result fields.
        The subscriber''s JSON body is nested under the result key. Returns 200 even
        for non-2xx subscriber responses — check status_code to distinguish. When
        the action declares parameters, they are checked (type, required, enum options)
        before the call; undeclared parameters pass through. When the action has a
        log_path, the subscriber answered 2xx and the result has a valid job_id, the
        envelope also has job_id: poll GET /stack-instances/{id}/actions/{name}/jobs/{job_id}/log
        for the job log.'
      parameters:
      - description: Instance ID
        in: path
        name: id
        required: true
        type: string
      - description: Action name
        in: path
        name: name
        required: true
        type: string
      - description: Optional parameters passed through to the subscriber
        in: body
        name: request
        schema:
          $ref: '#/definitions/handlers.invokeActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Caller is not the owner, an admin or a devops user
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Instance not found or action not registered
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Subscriber unreachable
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Action registry not configured
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Invoke a registered action against a stack instance
      tags:
      - stack-instances
  /api/v1/stack-instances/{id}/actions/{name}/jobs/{job_id}/log:
    get:
      consumes:
      - application/json
      description: Fetches the job log of an asynchronous action from the action subscriber,
        from the byte offset to the end (at most 256 KiB per call). The action config
        must have a log_path. Poll with next_offset until done is true. Only the instance
        owner, an admin or a devops user may read the job log (the same rule as invoke).
        The backend signs the subscriber request like an invoke call and never returns
        the subscriber URL.
      parameters:
      - description: Instance ID
        in: path
        name: id
        required: true
        type: string
      - description: Action name
        in: path
        name: name
        required: true
        type: string
      - description: 'Job ID (1-128 characters: A-Z a-z 0-9 . _ -, not starting with
          a dot)'
        in: path
        name: job_id
        required: true
        type: string
      - description: Byte offset to read from (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.actionJobLogResponse'
        "400":
          description: Invalid job_id or offset
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Caller is not the owner, an admin or a devops user
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Instance, action, job log route or job not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Subscriber unreachable or returned an error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Action registry not configured
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read the job log of an asynchronous action
      tags:
      - stack-instances
