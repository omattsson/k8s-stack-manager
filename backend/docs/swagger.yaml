host: localhost:8081
info:
  contact: {}
  description: This is the API documentation for the backend service
  title: Backend API
  version: "1.0"
paths:
  /api/v1/admin/cleanup-policies:
    get:
      description: Returns all cleanup policies
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.CleanupPolicy'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all cleanup policies
      tags:
      - cleanup-policies
    post:
      consumes:
      - application/json
      description: 'Creates a new cleanup policy and reloads the scheduler. condition
        is a comma-separated list of key:value pairs (all must match): status:<status>;
        idle_days:<N> (no deploy for N days, creation time when never deployed); age_days:<N>
        (created more than N days ago); stopped_days:<N> (stopped, and the last stop
        finished N or more days ago; instances without a recorded stop time never
        match); ttl_expired.'
      parameters:
      - description: Cleanup policy
        in: body
        name: policy
        required: true
        schema:
          $ref: '#/definitions/models.CleanupPolicy'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.CleanupPolicy'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a cleanup policy
      tags:
      - cleanup-policies
  /api/v1/admin/cleanup-policies/{id}:
    delete:
      description: Deletes a cleanup policy and reloads the scheduler
      parameters:
      - description: Policy ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a cleanup policy
      tags:
      - cleanup-policies
    put:
      consumes:
      - application/json
      description: 'Updates an existing cleanup policy and reloads the scheduler.
        Partial update: only the fields in the body change (for example {"enabled":
        false}); the merged policy is validated. See the create endpoint for the condition
        syntax (status, idle_days, age_days, stopped_days, ttl_expired).'
      parameters:
      - description: Policy ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: policy
        required: true
        schema:
          $ref: '#/definitions/handlers.updateCleanupPolicyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CleanupPolicy'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a cleanup policy
      tags:
      - cleanup-policies
  /api/v1/admin/cleanup-policies/{id}/run:
    post:
      description: Executes a cleanup policy immediately and answers when the run
        ends. Use ?dry_run=true to preview matches without acting. Stop and clean
        only start the operations (fast). A delete runs the pre-instance-delete hooks
        per instance first, so a delete run can take up to the number of matches times
        (5 minutes, or the sum of the pre-instance-delete hook timeouts plus one minute
        when longer); use a client timeout that allows this. The run fires cleanup-policy-executed
        when at least one instance matched.
      parameters:
      - description: Policy ID
        in: path
        name: id
        required: true
        type: string
      - description: Dry run mode
        in: query
        name: dry_run
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/scheduler.CleanupResult'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Run a cleanup policy manually
      tags:
      - cleanup-policies
  /api/v1/admin/notification-channels:
    get:
      description: Returns all notification channels with subscription counts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.notificationChannelWithCount'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all notification channels
      tags:
      - notification-channels
    post:
      consumes:
      - application/json
      description: 'Creates a new notification channel. Optional filters limit the
        channel to some stack instances: instance_name_patterns (globs, path.Match
        syntax, case-insensitive), owner_ids, definition_ids and cluster_ids. Each
        set filter must match (AND); one value of a filter is enough (OR); empty filters
        match all instances. Events without an instance go only to channels without
        filters; a cleanup policy run goes to a channel when at least one affected
        instance matches. An invalid pattern gives 400. An ID that does not exist
        gives a warning in the response; the channel is saved.'
      parameters:
      - description: Channel
        in: body
        name: channel
        required: true
        schema:
          $ref: '#/definitions/handlers.createChannelRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.notificationChannelResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a notification channel
      tags:
      - notification-channels
  /api/v1/admin/notification-channels/{id}:
    delete:
      description: Deletes a notification channel and its subscriptions
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a notification channel
      tags:
      - notification-channels
    get:
      description: Returns a notification channel by ID, with its filters
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.NotificationChannel'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a notification channel
      tags:
      - notification-channels
    put:
      consumes:
      - application/json
      description: Updates an existing notification channel. filters replaces the
        channel filters (omit it to keep them, send {} to remove them); the rules
        are the same as for create. An ID that does not exist gives a warning in the
        response.
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      - description: Channel updates
        in: body
        name: channel
        required: true
        schema:
          $ref: '#/definitions/handlers.updateChannelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.notificationChannelResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a notification channel
      tags:
      - notification-channels
  /api/v1/admin/notification-channels/{id}/delivery-logs:
    get:
      description: Returns paginated delivery logs for a notification channel
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      - description: Page size (default 20)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List delivery logs for a channel
      tags:
      - notification-channels
  /api/v1/admin/notification-channels/{id}/subscriptions:
    get:
      description: Returns event type subscriptions for a channel
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get channel subscriptions
      tags:
      - notification-channels
    put:
      consumes:
      - application/json
      description: Replaces all event type subscriptions for a channel
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      - description: Event types
        in: body
        name: subscriptions
        required: true
        schema:
          $ref: '#/definitions/handlers.updateSubscriptionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update channel subscriptions
      tags:
      - notification-channels
  /api/v1/admin/notification-channels/{id}/test:
    post:
      description: Sends a test payload to the channel's webhook URL
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Test a notification channel
      tags:
      - notification-channels
  /api/v1/admin/notification-channels/event-types:
    get:
      description: Returns all known event types that channels can subscribe to
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List all event types
      tags:
      - notification-channels
  /api/v1/admin/orphaned-namespaces:
    get:
      description: Lists all Kubernetes namespaces matching the stack-* pattern that
        have no corresponding stack instance in the database. Pass ?details=true to
        include resource counts and helm releases per namespace (expensive). The managed
        field is true when the namespace has the label managed-by=k8s-stack-manager.
      parameters:
      - description: Include resource counts and helm releases (true/false)
        in: query
        name: details
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.OrphanedNamespaceResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List orphaned namespaces
      tags:
      - Admin
  /api/v1/admin/orphaned-namespaces/{namespace}:
    delete:
      description: Verifies the namespace is orphaned, uninstalls all Helm releases,
        and deletes the Kubernetes namespace. A namespace without the label managed-by=k8s-stack-manager
        is deleted only when the confirm query parameter is the full namespace name.
      parameters:
      - description: Namespace name
        in: path
        name: namespace
        required: true
        type: string
      - description: Full namespace name; required when the namespace is not managed
          by k8s-stack-manager
        in: query
        name: confirm
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete an orphaned namespace
      tags:
      - Admin
