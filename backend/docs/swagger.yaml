  /api/v1/stack-definitions:
    get:
      description: |-
        List stack definitions with server-side pagination, newest first. The filters name and owner combine (AND); total is the number of definitions that match.
        owner is "me" (the authenticated user), a username, or a user ID. A value in UUID form is matched as a user ID first, then as a username. An unknown username or ID gives an empty list. Each definition includes owner_username (omitted when the owner no longer exists) and chart_count (the number of charts; omitted when the count fails).
        The list is paged (default pageSize 25); with owner=me or name the total is the real number of matches, not the page size.
      parameters:
      - description: Filter by exact name
        in: query
        name: name
        type: string
      - description: 'Filter by owner: ''me'', a username, or a user ID'
        in: query
        name: owner
        type: string
      - description: Page number (default 1)
        in: query
        minimum: 1
        name: page
        type: integer
      - description: Items per page (default 25, max 100)
        in: query
        maximum: 100
        minimum: 1
        name: pageSize
        type: integer
      - description: Max items to return (default 25, max 100)
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Number of items to skip (default 0)
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list with data, total, page, pageSize
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Owner filter is too long
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: owner=me without an authenticated user
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List stack definitions
      tags:
      - stack-definitions
    post:
      consumes:
      - application/json
      description: Create a new stack definition. Definition names are unique per
        owner.
      parameters:
      - description: Definition object
        in: body
        name: definition
        required: true
        schema:
          $ref: '#/definitions/models.StackDefinition'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.StackDefinition'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: The owner already has a definition with this name
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a stack definition
      tags:
      - stack-definitions
