  /api/v1/users/{id}/api-keys:
    get:
      description: Returns all API keys for the given user. Admin or own user only.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
