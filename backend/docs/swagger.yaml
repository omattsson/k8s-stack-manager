      tags:
      - clusters
    get:
      description: Returns the resource quota configuration for a cluster, or 404
        if not set.
      parameters:
      - description: Cluster ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ResourceQuotaConfig'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get resource quota config for a cluster
      tags:
      - clusters
    put:
      consumes:
      - application/json
      description: Creates or updates the resource quota configuration for a cluster.
        Admin only. Each non-empty quantity must be a valid Kubernetes quantity (for
        example 500m, 2, 512Mi, 10Gi) and not negative; cpu_request must not exceed
        cpu_limit and memory_request must not exceed memory_limit; pod_limit must
        not be negative. Values are trimmed. Invalid input returns 400 with the field
        name. The quota is also checked merged with the quota override of every instance
        on the cluster (for the default cluster also instances without a cluster);
        a conflict returns 400 listing up to 10 instance names and the first rule
        broken.
