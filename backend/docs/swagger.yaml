  /api/v1/users/{id}/role:
    put:
      consumes:
      - application/json
      description: Sets the role of a local user. Admin only. The role of an SSO user
        comes from the identity provider and cannot be changed here (409). An admin
        cannot change their own role (403), the caller must still be an enabled admin
        in the database (403), and the last enabled admin cannot lose the admin role
        (409). An unchanged role is a no-op (changed=false). A change revokes the
        user's current access tokens, all refresh tokens and open WebSocket connections,
        so the next request needs a new login with the new role. API keys stay valid
        and use the new role at once.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: New role
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ChangeRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ChangeRoleResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change the role of a user
      tags:
      - users
