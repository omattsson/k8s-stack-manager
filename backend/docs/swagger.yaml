  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Issues a new access token using the refresh token cookie. Rotates
        the refresh token (old one invalidated, new one issued). A session ends SESSION_MAX_LIFETIME
        after login and after SESSION_IDLE_TIMEOUT without requests; rotation never
        extends the session. A token rotated less than REFRESH_REUSE_GRACE ago (for
        example a concurrent refresh from a second browser tab) gets a new access
        token without a new cookie. Any other reuse of a consumed token revokes the
        session.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.RefreshResponse'
        "401":
          description: Invalid, expired, or revoked refresh token or session
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Account disabled
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "501":
          description: Refresh tokens not enabled
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - auth
