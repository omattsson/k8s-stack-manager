  /api/v1/stack-instances/{id}/deploy-preview:
    get:
      description: 'Compare pending merged values against the running values per chart.
        Pending values use the deploy pipeline: cluster shared values (by priority),
        chart defaults, instance overrides, locked template values. Previous values
        are the values of the last deploy, or of the last successful rollback. has_changes
        compares the YAML content (key order and formatting do not matter). values_drift
        is true when the last operation was a successful rollback and at least one
        chart has changes: the next deploy undoes the rollback. A shared values load
        error returns 500 (fail closed).'
      parameters:
      - description: Instance ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.DeployPreviewResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
