  /ws:
    get:
      description: 'Upgrades the HTTP connection to a WebSocket for real-time events.
        Authenticate via one of: `Sec-WebSocket-Protocol: bearer, <jwt>` subprotocol
        header, `Authorization: Bearer <jwt>` header, or `?token=<jwt>` query parameter
        (the query token is redacted from access logs and traces by middleware before
        the handler runs). The upgrade runs the same checks as the HTTP JWT auth:
        a revoked token (logout), a token issued at or before a user block (user deleted,
        disabled or password reset), a deleted user and a disabled user get 401. The
        server closes an open socket with close code 1008 when the session is revoked
        and when the access token expires; the client must reconnect with a fresh
        token.'
      parameters:
      - description: JWT authentication token (also accepted via Authorization header
          or Sec-WebSocket-Protocol subprotocol)
        in: query
        name: token
        type: string
      responses:
        "101":
          description: Switching Protocols
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Open a WebSocket connection
      tags:
      - websocket
produces:
- application/json
schemes:
- http
- https
securityDefinitions:
  ApiKeyAuth:
    description: 'API key (format: "sk_<key>")'
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    description: 'JWT Bearer token (format: "Bearer <token>")'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
