  /api/v1/users/{id}:
    delete:
      description: Permanently deletes a user account. Admin only. Cannot delete own
        account (400). The last enabled admin cannot be deleted (409). The caller
        must still be an enabled admin in the database (403). Revokes the user's current
        access tokens and all refresh tokens, and deletes all API keys of the user.
