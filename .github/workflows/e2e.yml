name: E2E Tests

# Runs the Playwright end-to-end tests (frontend/e2e) against a real backend and
# MySQL. The runner has no cluster, so the specs that need one are skipped (see
# E2E_KUBECONFIG in the Makefile). The main suite runs in 4 parallel jobs
# (`make test-e2e E2E_SHARD=n/4`), each with its own backend and MySQL. The job
# `isolated` runs the Playwright project `isolated` (`make test-e2e-isolated`).

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.yml'
      - 'Makefile'
      - '.github/workflows/e2e.yml'
  # No run on push to main: the pull request ran the suite on the same code.
  # The weekly run checks main after several merges.
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: playwright (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['main 1/4', 'main 2/4', 'main 3/4', 'main 4/4', 'isolated']
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.22.1'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        env:
          PW_WORKERS: '2'
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$SHARD" = isolated ]; then
            make test-e2e-isolated
          else
            make test-e2e E2E_SHARD="${SHARD#main }"
          fi

      - name: Name the artifact
        if: ${{ !cancelled() }}
        env:
          SHARD: ${{ matrix.shard }}
        run: echo "ARTIFACT=playwright-report-$(echo "$SHARD" | tr ' /' '--')" >> "$GITHUB_ENV"

      - name: Upload Playwright report and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/playwright-report-isolated/
            frontend/test-results-isolated/
            frontend/test-logs/
          retention-days: 14
          if-no-files-found: ignore
