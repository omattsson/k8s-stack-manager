name: E2E Tests

# Runs the Playwright end-to-end tests (frontend/e2e) against a real backend and
# MySQL through `make test-e2e`. The runner has no cluster, so the specs that
# need one are skipped (see E2E_KUBECONFIG in the Makefile). After the main
# suite, `make test-e2e` restarts the backend with short session limits and
# runs the Playwright project `isolated` (report in playwright-report-isolated/).

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.yml'
      - 'Makefile'
      - '.github/workflows/e2e.yml'
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.yml'
      - 'Makefile'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.17.0'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        env:
          PW_WORKERS: '2'
        run: make test-e2e

      - name: Upload Playwright report and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/playwright-report-isolated/
            frontend/test-results-isolated/
            frontend/test-logs/
          retention-days: 14
          if-no-files-found: ignore
