apiVersion: v2
name: k8s-stack-manager
description: Self-service environments for multi-service Helm applications on your own Kubernetes clusters (web UI, API, MySQL)
type: application
version: 0.17.0
appVersion: "0.18.0"
keywords:
  - kubernetes
  - helm
  - stack-manager
  - argo-rollouts
  - platform-engineering
  - ephemeral-environments
  - preview-environments
  - self-service
home: https://github.com/omattsson/k8s-stack-manager
icon: https://raw.githubusercontent.com/omattsson/k8s-stack-manager/main/frontend/public/logo.svg
sources:
  - https://github.com/omattsson/k8s-stack-manager
maintainers:
  - name: omattsson
    url: https://github.com/omattsson
# Artifact Hub (https://artifacthub.io). In each release pull request, set
# the image tags of artifacthub.io/images to appVersion, and replace
# artifacthub.io/changes with the changes since the last chart version
# (Artifact Hub shows them as the changelog of the version).
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/changes: |
    - kind: added
      description: The audit log records sign-in events (login, failed login with the reason, OIDC login, logout, refresh token reuse), the request context of each entry (client IP, request ID, trace ID, auth method, API key ID), the changed fields of an update and the entity name. Secret fields are redacted.
    - kind: added
      description: The Audit Log page filters by username, links each entity and shows the context and the changes of an entry. The instance, definition and template pages have an Audit history section.
    - kind: added
      description: backend.audit.stdout (AUDIT_LOG_STDOUT) also writes each audit entry as one JSON line on stdout, for a SIEM. The metric audit.write_failed_total counts entries that the database did not store.
    - kind: added
      description: extraObjects renders extra manifests with the release, for example Helm hook Jobs.
    - kind: changed
      description: Database migration 68 adds six nullable columns and two indexes to audit_logs. Old rows keep NULL in the new columns.
    - kind: security
      description: The backend is built with Go 1.27.4 (GO-2026-6859 in net/http).
    - kind: changed
      description: Dependency updates (golang.org/x/crypto 0.59.0, golang.org/x/oauth2 0.38.0, golang.org/x/sync 0.25.0, axios 1.21.1).
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/omattsson/k8s-stack-manager#readme
    - name: Getting Started
      url: https://github.com/omattsson/k8s-stack-manager/blob/main/docs/getting-started.md
    - name: stackctl (CLI)
      url: https://github.com/omattsson/stackctl
  artifacthub.io/images: |
    - name: backend
      image: ghcr.io/omattsson/k8s-stack-manager/backend:0.18.0
    - name: frontend
      image: ghcr.io/omattsson/k8s-stack-manager/frontend:0.18.0
    - name: mysql
      image: mysql:8.4.13
  artifacthub.io/screenshots: |
    - title: Dashboard
      url: https://raw.githubusercontent.com/omattsson/k8s-stack-manager/main/docs/screenshots/dashboard.png
    - title: Port-forward and exec commands on the stack page
      url: https://raw.githubusercontent.com/omattsson/k8s-stack-manager/main/docs/screenshots/access-urls.png
    - title: Template gallery
      url: https://raw.githubusercontent.com/omattsson/k8s-stack-manager/main/docs/screenshots/templates.png
