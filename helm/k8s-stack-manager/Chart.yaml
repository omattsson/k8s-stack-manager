apiVersion: v2
name: k8s-stack-manager
description: Self-service environments for multi-service Helm applications on your own Kubernetes clusters (web UI, API, MySQL)
type: application
version: 0.16.0
appVersion: "0.17.0"
keywords:
  - kubernetes
  - helm
  - stack-manager
  - argo-rollouts
  - platform-engineering
  - ephemeral-environments
  - preview-environments
  - self-service
home: https://github.com/omattsson/k8s-stack-manager
icon: https://raw.githubusercontent.com/omattsson/k8s-stack-manager/main/frontend/public/logo.svg
sources:
  - https://github.com/omattsson/k8s-stack-manager
maintainers:
  - name: omattsson
    url: https://github.com/omattsson
# Artifact Hub (https://artifacthub.io). In each release pull request, set
# the image tags of artifacthub.io/images to appVersion, and replace
# artifacthub.io/changes with the changes since the last chart version
# (Artifact Hub shows them as the changelog of the version).
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/changes: |
    - kind: added
      description: The API checks chart values on definitions and templates when they are saved and returns 400 for values that Helm cannot parse. The Definition, Template Builder and Instantiate forms block the save.
    - kind: added
      description: The exec hints of the stack status and pods responses include exec_pods, the pod that stack exec picks for each hinted container.
    - kind: security
      description: The backend and frontend images are rebuilt with the fixed Alpine packages (zlib, libexpat). The bundled MySQL image is pinned to mysql:8.4.13.
    - kind: fixed
      description: A stack values override that the deploy cannot parse is refused with 400, and the editor blocks the save. The stack pages show the API error of failed actions, and the stopped, stopping and cleaning status chips are clearer.
    - kind: fixed
      description: A partial deploy counts as finished on the stack list, and the Recent Stacks cards follow status changes and deletes without a page reload.
    - kind: fixed
      description: Notification links open an existing page.
    - kind: changed
      description: The UI meets the WCAG AA contrast ratio in the tested states, in light and dark mode, with adjusted colours in both modes. Cards are keyboard links with focus rings, pod health has icons, and screen readers get headings, landmarks and a live region for stack changes. The bulk toolbar counts selected stacks that a filter hides, and a filter without a match offers Clear filters.
    - kind: changed
      description: Dependency updates (Azure SDK azcore 1.24.0).
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/omattsson/k8s-stack-manager#readme
    - name: Getting Started
      url: https://github.com/omattsson/k8s-stack-manager/blob/main/docs/getting-started.md
    - name: stackctl (CLI)
      url: https://github.com/omattsson/stackctl
  artifacthub.io/images: |
    - name: backend
      image: ghcr.io/omattsson/k8s-stack-manager/backend:0.17.0
    - name: frontend
      image: ghcr.io/omattsson/k8s-stack-manager/frontend:0.17.0
    - name: mysql
      image: mysql:8.4.13
  artifacthub.io/screenshots: |
    - title: Dashboard
      url: https://raw.githubusercontent.com/omattsson/k8s-stack-manager/main/docs/screenshots/dashboard.png
    - title: Port-forward and exec commands on the stack page
      url: https://raw.githubusercontent.com/omattsson/k8s-stack-manager/main/docs/screenshots/access-urls.png
    - title: Template gallery
      url: https://raw.githubusercontent.com/omattsson/k8s-stack-manager/main/docs/screenshots/templates.png
