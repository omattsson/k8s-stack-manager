apiVersion: v2
name: k8s-stack-manager
description: Self-service environments for multi-service Helm applications on your own Kubernetes clusters (web UI, API, MySQL)
type: application
version: 0.15.1
appVersion: "0.16.0"
keywords:
  - kubernetes
  - helm
  - stack-manager
  - argo-rollouts
  - platform-engineering
  - ephemeral-environments
  - preview-environments
  - self-service
home: https://github.com/omattsson/k8s-stack-manager
icon: https://raw.githubusercontent.com/omattsson/k8s-stack-manager/main/frontend/public/logo.svg
sources:
  - https://github.com/omattsson/k8s-stack-manager
maintainers:
  - name: omattsson
    url: https://github.com/omattsson
# Artifact Hub (https://artifacthub.io). In each release pull request, set
# the image tags of artifacthub.io/images to appVersion, and replace
# artifacthub.io/changes with the changes since the last chart version
# (Artifact Hub shows them as the changelog of the version).
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/changes: |
    - kind: added
      description: Values schema (values.schema.json). Helm checks the values on install, upgrade, template and lint, and Artifact Hub lists every value with its type, default and description.
    - kind: changed
      description: A value of the wrong type now stops the install with a schema error, for example a switch given as a string (--set-string x.enabled=true; use true) or an image tag given as a number (quote it).
    - kind: added
      description: Changelog of each chart version on Artifact Hub (artifacthub.io/changes).
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/omattsson/k8s-stack-manager#readme
    - name: Getting Started
      url: https://github.com/omattsson/k8s-stack-manager/blob/main/docs/getting-started.md
    - name: stackctl (CLI)
      url: https://github.com/omattsson/stackctl
  artifacthub.io/images: |
    - name: backend
      image: ghcr.io/omattsson/k8s-stack-manager/backend:0.16.0
    - name: frontend
      image: ghcr.io/omattsson/k8s-stack-manager/frontend:0.16.0
    - name: mysql
      image: mysql:8.4
  artifacthub.io/screenshots: |
    - title: Dashboard
      url: https://raw.githubusercontent.com/omattsson/k8s-stack-manager/main/docs/screenshots/dashboard.png
    - title: Port-forward and exec commands on the stack page
      url: https://raw.githubusercontent.com/omattsson/k8s-stack-manager/main/docs/screenshots/access-urls.png
    - title: Template gallery
      url: https://raw.githubusercontent.com/omattsson/k8s-stack-manager/main/docs/screenshots/templates.png
