# Non-sensitive values used to lint and render the Azure Key Vault ESO path.
mysql:
  auth:
    user: stack-manager

externalSecrets:
  enabled: true
  azureKeyVault:
    vaultUrl: https://example.vault.azure.net
    tenantId: 00000000-0000-0000-0000-000000000000
    authType: WorkloadIdentity
    workloadIdentity:
      clientId: 00000000-0000-0000-0000-000000000000
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: k8s-stack-manager-jwt-secret
    - secretKey: DB_PASSWORD
      remoteRef:
        key: k8s-stack-manager-db-password
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: k8s-stack-manager-mysql-root-password
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: k8s-stack-manager-mysql-password