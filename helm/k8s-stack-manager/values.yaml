global:
  imageRegistry: "ghcr.io/omattsson"
  imagePullSecrets: []
  appArmor:
    enabled: false  # Set to true for environments with AppArmor support (e.g. most Linux distributions)

nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Argo Rollouts (progressive delivery)
# ---------------------------------------------------------------------------
argoRollouts:
  enabled: false  # Set to false to use standard Kubernetes Deployments
  # NOTE: Canary weight-based traffic splitting requires ingress.type=traefik.
  # With other ingress types, rollouts still pause between steps but traffic
  # is pod-level (round-robin), not percentage-weighted.

# ---------------------------------------------------------------------------
# Backend
# ---------------------------------------------------------------------------
backend:
  image:
    repository: k8s-stack-manager/backend
    tag: ""  # Empty = uses Chart.AppVersion
    pullPolicy: IfNotPresent
  # Every replica serves the HTTP API and WebSocket clients. Only the leader
  # replica (see leaderElection) runs the background workers. The replicas
  # share WebSocket events through the database (see wsFanout), so a client
  # on any replica sees deploy logs and status events of all replicas.
  replicas: 2
  port: 8081

  # Leader election (env LEADER_ELECTION_*). The replicas compete for a
  # coordination.k8s.io Lease in the release namespace. Only the leader runs
  # the background workers: TTL reaper, expiry warner, cleanup scheduler,
  # quota and secret monitors, pull secret refresher, cluster health poller,
  # k8s status watcher. A replica that loses the lease stops its workers and
  # campaigns again; on shutdown the leader releases the lease.
  # The chart creates a Role + RoleBinding (leases: get, create, update) for
  # the backend service account when serviceAccount.create is true; otherwise
  # grant these permissions yourself. POD_NAME and POD_NAMESPACE come from the
  # downward API. Timings: backend.env LEADER_ELECTION_LEASE_DURATION (15s),
  # LEADER_ELECTION_RENEW_DEADLINE (10s), LEADER_ELECTION_RETRY_PERIOD (2s).
  # With enabled: false, every replica runs the workers (use one replica).
  leaderElection:
    enabled: true
    # Lease name. Empty = "<fullname>-workers".
    leaseName: ""

  # WebSocket fan-out between replicas (env WS_FANOUT_*). Each replica
  # delivers a WebSocket message to its own clients at once and writes one
  # row to the ws_events table. Every replica polls the table each
  # pollInterval and delivers the rows of the other replicas to its clients
  # (delay up to about one pollInterval). The leader deletes rows older than
  # retention every minute. Enabled by default: with one replica the cost is
  # one small indexed query per pollInterval, and a scale-up needs no change.
  # Set enabled: false only for a single replica that must not write to the
  # database. The replica identity is POD_NAME (downward API).
  # Note: the rows go to the MySQL binary log like all writes. The bundled
  # MySQL 8 keeps binary logs for 30 days by default, so deploy log lines add
  # to the binary log size on the MySQL volume for that time
  # (binlog_expire_logs_seconds in mysql.config sets a shorter expiry).
  wsFanout:
    enabled: true
    # Time between two polls (50ms to 1m).
    pollInterval: 500ms
    # Age after which the leader deletes rows (at least 1m).
    retention: 5m

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: "1"

  # Non-secret environment variables (stored in ConfigMap).
  env:
    APP_NAME: k8s-stack-manager
    GO_ENV: production
    APP_DEBUG: "false"
    SERVER_HOST: "0.0.0.0"
    SERVER_PORT: "8081"
    SERVER_READ_TIMEOUT: "10s"
    SERVER_WRITE_TIMEOUT: "0"
    SERVER_IDLE_TIMEOUT: "30s"
    SERVER_SHUTDOWN_TIMEOUT: "30s"
    LOG_LEVEL: info
    API_VERSION: v1
    API_PREFIX: /api
    RATE_LIMIT: "2000"
    LOGIN_RATE_LIMIT: "500"
    CORS_ALLOWED_ORIGINS: "*"
    CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
    CORS_ALLOWED_HEADERS: "Origin,Content-Type,Accept,Authorization"
    CORS_MAX_AGE: "300"
    SELF_REGISTRATION: "true"
    DEFAULT_BRANCH: master
    HELM_BINARY: helm
    # helm --timeout for one chart; a deploy of N charts may take N x this value.
    DEPLOYMENT_TIMEOUT: "10m"
    MAX_CONCURRENT_DEPLOYS: "5"
    # Wildcard TLS secret replication — copies a shared TLS secret into every
    # stack namespace so ingresses can reference it. Disabled when
    # WILDCARD_TLS_SOURCE_SECRET is empty. Set to enable for local dev flows
    # where a single pre-existing cert is reused across all stacks.
    WILDCARD_TLS_SOURCE_NAMESPACE: ""
    WILDCARD_TLS_SOURCE_SECRET: ""
    WILDCARD_TLS_TARGET_SECRET: ""
    # ---- Extension hooks (see EXTENDING.md) ----
    # Hooks are configured via the top-level `hooks` section below.
    # When hooks.enabled is true, a ConfigMap and volume mount are
    # created automatically — no manual HOOKS_CONFIG_FILE needed.
    JWT_EXPIRATION: "24h"
    # ---- Sessions (refresh tokens) — see WIKI.md "Sessions" ----
    # ACCESS_TOKEN_EXPIRATION: "15m"   # lifetime of one access token
    # SESSION_IDLE_TIMEOUT: "30m"      # end a session after this time without requests
    # SESSION_MAX_LIFETIME: "12h"      # absolute lifetime from login; refresh never extends it
    # REFRESH_REUSE_GRACE: "30s"       # concurrent refresh from two tabs; "0" disables
    # SECURE_COOKIES — Secure flag on the refresh-token cookie. When unset, the
    # chart renders "true" if the ingress has TLS (ingress.type=traefik with
    # ingress.traefik.tls.secretName, or ingress.type=ingress with ingress.tls).
    # Set it explicitly to override, for example "true" when TLS terminates at
    # a load balancer in front of the ingress, or "false" to opt out.
    # SECURE_COOKIES: "true"
    ADMIN_USERNAME: admin
    # OIDC (disabled by default)
    OIDC_ENABLED: "false"
    OIDC_SCOPES: "openid,profile,email"
    OIDC_ROLE_CLAIM: roles
    OIDC_AUTO_PROVISION: "true"
    OIDC_LOCAL_AUTH: "true"
    OIDC_STATE_TTL: "5m"
    SESSION_STORE: "mysql"
    ENABLE_SWAGGER: "false"

  # Per-stack-namespace RoleBindings (NAMESPACE_ROLE_BINDINGS_JSON).
  #
  # When set, the deployer applies one RoleBinding per entry to every stack
  # namespace at pre-install time, binding the named ServiceAccount (typically
  # in a centrally-deployed add-on namespace like `refresh-db`) to a
  # pre-existing ClusterRole. This is the standard pattern for granting
  # cross-namespace add-ons per-stack permissions without a cluster-wide
  # binding.
  #
  # Prerequisites the deployer does NOT create on your behalf:
  #   * The ClusterRole named by `clusterRole` must already exist.
  #   * The ServiceAccount named by `serviceAccountName` must already exist
  #     in `serviceAccountNamespace`, and the consuming pod must have a way
  #     to mount its token (Kubernetes ≥ 1.24 no longer auto-generates SA
  #     token secrets — projected tokens or an explicit token Secret are
  #     required).
  # The deployer treats each RoleBinding's Subjects as authoritative — any
  # additional subjects added externally to a RoleBinding by the configured
  # name will be dropped on the next reconcile.
  #
  # Disabled when the list is empty. The configmap-renderer serialises this
  # list to JSON and puts it on the NAMESPACE_ROLE_BINDINGS_JSON env var.
  #
  # Example:
  # namespaceRoleBindings:
  #   - clusterRole: refresh-db-snap-manager
  #     serviceAccountName: refresh-db
  #     serviceAccountNamespace: refresh-db
  #     # roleBindingName: refresh-db-snap-manager   # optional; defaults to clusterRole
  namespaceRoleBindings: []

  # Extra environment variables, volumes and volume mounts for the backend
  # container (plain Kubernetes syntax). Example: give Helm a registry login
  # file (docker config.json format) for OCI chart repositories that need
  # authentication, from a Secret that another tool keeps up to date:
  #   extraEnv:
  #     - name: HELM_REGISTRY_CONFIG
  #       value: /etc/helm-registry/config.json
  #   extraVolumes:
  #     - name: helm-registry
  #       secret:
  #         secretName: helm-registry-config
  #         items:
  #           - key: .dockerconfigjson
  #             path: config.json
  #   extraVolumeMounts:
  #     - name: helm-registry
  #       mountPath: /etc/helm-registry
  #       readOnly: true
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

  # Secret environment variables (stored in Secret).
  secrets:
    JWT_SECRET: "CHANGE-ME-generate-a-random-secret"               # MUST be provided — minimum 16 chars
    ADMIN_PASSWORD: "CHANGE-ME-set-a-secure-password"
    KUBECONFIG_ENCRYPTION_KEY: ""
    # Git providers (optional). Instead of a PAT, Azure DevOps can use workload
    # identity: set backend.env.AZURE_DEVOPS_AUTH=workload-identity plus
    # AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_FEDERATED_TOKEN_FILE, and mount a
    # projected service-account token (audience api://AzureADTokenExchange) with
    # backend.extraVolumes / backend.extraVolumeMounts.
    AZURE_DEVOPS_PAT: ""
    GITLAB_TOKEN: ""
    # OIDC secrets (optional)
    OIDC_CLIENT_SECRET: ""

  rollout:
    strategy:
      canary:
        steps:
          - setWeight: 20
          - pause:
              duration: 30s
          - setWeight: 50
          - pause:
              duration: 30s
          - setWeight: 80
          - pause:
              duration: 30s
    analysis:
      enabled: false
      interval: 30s
      count: 5
      failureLimit: 2

  pdb:
    enabled: true
    maxUnavailable: 1
    # minAvailable: 1  # Alternative — use one or the other

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

  serviceAccount:
    create: true
    annotations: {}

# ---------------------------------------------------------------------------
# External Secrets Operator
# ---------------------------------------------------------------------------
# When enabled, ESO synchronizes the backend Secret from Azure Key Vault and
# the inline backend Secret is not rendered. Install ESO and configure the
# selected SecretStore authentication method before installing this chart.
externalSecrets:
  enabled: false
  refreshInterval: 1h
  secretStore:
    # Set create=false and name to use a pre-existing SecretStore or
    # ClusterSecretStore. ClusterSecretStore resources are cluster-scoped.
    create: true
    kind: SecretStore
    name: ""
  azureKeyVault:
    vaultUrl: "" # e.g. https://my-vault.vault.azure.net
    tenantId: ""
    # WorkloadIdentity uses the backend ServiceAccount, which this chart
    # annotates with workloadIdentity.clientId. ServicePrincipal credentials
    # must exist in the referenced Secret; they are never stored in values.
    authType: WorkloadIdentity
    workloadIdentity:
      clientId: ""
    servicePrincipal:
      secretName: ""
      clientIdKey: client-id
      clientSecretKey: client-secret
  # Each entry maps a Key Vault secret name to a key in an ESO-managed Secret.
  # JWT_SECRET is required. With mysql.enabled=true, MYSQL_ROOT_PASSWORD is
  # required; MYSQL_PASSWORD is also required when mysql.auth.user is non-empty.
  # With mysql.enabled=true, backend DB_PASSWORD derives from the selected MySQL
  # credential mapping. With mysql.enabled=false, a provided DB_PASSWORD mapping
  # is passed through to the backend ExternalSecret for an external database.
  data: []
  # - secretKey: JWT_SECRET
  #   remoteRef:
  #     key: k8s-stack-manager-jwt-secret
  # - secretKey: ADMIN_PASSWORD
  #   remoteRef:
  #     key: k8s-stack-manager-admin-password

# ---------------------------------------------------------------------------
# Frontend
# ---------------------------------------------------------------------------
frontend:
  # Set to false for headless / API-only deployments — skips all frontend resources
  # (Deployment/Rollout, Service, ConfigMap, HPA, PDB, ServiceAccount) and the
  # ingress rule routing `/` to the frontend. The backend (/api, /ws, /health,
  # /swagger) is unaffected.
  enabled: true
  image:
    repository: k8s-stack-manager/frontend
    tag: ""  # Empty = uses Chart.AppVersion
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8080

  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

  rollout:
    strategy:
      canary:
        steps:
          - setWeight: 20
          - pause:
              duration: 30s
          - setWeight: 50
          - pause:
              duration: 30s
          - setWeight: 80
          - pause:
              duration: 30s
    analysis:
      enabled: false
      interval: 30s
      count: 5
      failureLimit: 2

  pdb:
    enabled: true
    maxUnavailable: 1
    # minAvailable: 1  # Alternative — use one or the other

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

  serviceAccount:
    create: true
    annotations: {}

# ---------------------------------------------------------------------------
# Branding (web UI title, logo and favicon)
# ---------------------------------------------------------------------------
# The backend serves these values at GET /api/v1/ui-config (public, no token)
# and the web UI loads them at startup, also on the login page. The values go
# to the backend ConfigMap as APP_TITLE, APP_LOGO_URL and APP_FAVICON_URL.
# An explicit backend.env value wins. Empty: the built-in default.
# A URL is a same-origin path ("/branding/logo.svg") or an https URL. The
# backend refuses other forms at startup (http:, javascript:, data:, "//host/...").
branding:
  # Product name in the browser tab, sidebar, app bar, login page and setup
  # wizard (max 100 characters). Empty: "K8s Stack Manager".
  title: ""
  # Logo image. Empty: the built-in logo.
  logoUrl: ""
  # Browser tab icon. Empty: the built-in /favicon.svg.
  faviconUrl: ""
  # Optional: serve the image files from the frontend pod instead of an
  # external URL. The chart renders a ConfigMap and mounts it into the
  # frontend nginx at /usr/share/nginx/html/branding/. Refer to a file as
  # "/branding/<name>", for example logoUrl: /branding/logo.svg.
  # nginx serves the files with the content type of the extension (svg, png,
  # ico, webp, jpg, gif), X-Content-Type-Options: nosniff and a sandbox
  # Content-Security-Policy (script in an SVG does not run).
  # files: text files (SVG), file name -> content.
  # binaryFiles: binary files (PNG, ICO), file name -> base64 content.
  # A file name must match ^[-._a-zA-Z0-9]+$. The total size of all files
  # (binaryFiles decoded) must be at most 900 KiB; the render fails otherwise.
  files: {}
  #   logo.svg: |
  #     <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">...</svg>
  binaryFiles: {}
  #   favicon.png: iVBORw0KGgo...

# ---------------------------------------------------------------------------
# MySQL Database
# ---------------------------------------------------------------------------
mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  auth:
    rootPassword: "CHANGE-ME-set-a-secure-password"
    database: app          # Database name to create
    user: ""               # Optional: create a non-root user
    password: ""           # Optional: password for non-root user
  persistence:
    enabled: true     # Set false for local dev (uses emptyDir, data lost on pod restart)
    size: 5Gi
    storageClass: ""
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 500m
  config: |
    [mysqld]
    max_connections=100
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci

# ---------------------------------------------------------------------------
# OpenTelemetry Collector
# ---------------------------------------------------------------------------
otel:
  enabled: false
  sampleRate: "1.0"   # Trace sampling rate (0.0-1.0). Reduce for production.
  collector:
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: "0.120.0"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# ---------------------------------------------------------------------------
# Extension Hooks (see EXTENDING.md)
# ---------------------------------------------------------------------------
# Lifecycle subscriptions (pre-deploy, deploy-finalized, etc.) and named
# actions (redis-sync, db-refresh, etc.) invoked via the generic
# POST /api/v1/stack-instances/:id/actions/:name route.
hooks:
  enabled: false
  subscriptions: []
  # - name: teams-notifier
  #   events: ["deploy-finalized"]
  #   url: "http://teams-notifier.extensions.svc.cluster.local:8080/hook"
  #   timeout_seconds: 10
  #   failure_policy: ignore
  #   secret_env: TEAMS_NOTIFIER_HOOK_SECRET
  # - name: ci-trigger-gate
  #   events: ["pre-deploy"]
  #   url: "http://ci-trigger-gate.extensions.svc.cluster.local:8080/hook"
  #   timeout_seconds: 600
  #   failure_policy: fail
  #   secret_env: CI_TRIGGER_WEBHOOK_SECRET
  actions: []
  # - name: redis-sync
  #   url: "http://redis-sync.extensions.svc.cluster.local:8080/action"
  #   description: "Flush and reseed Redis cache"
  #   timeout_seconds: 120
  #   secret_env: REDIS_SYNC_HOOK_SECRET
  #   # Optional UI metadata (see EXTENDING.md "Actions in the web UI"):
  #   label: "Sync Redis"
  #   confirm: "This flushes the Redis cache of the stack."
  #   parameters:
  #     - name: dry_run
  #       type: bool
  #   # Optional job log of an asynchronous action (path on the host of url):
  #   log_path: "/jobs/{job_id}/log"

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  # type: traefik | ingress | none
  #   traefik  — Traefik IngressRoute CRD (requires Traefik with CRDs installed)
  #   ingress  — Standard Kubernetes Ingress (works with any ingress controller)
  #   none     — No ingress; use kubectl port-forward to access services
  type: traefik

  host: ""  # Empty = match all hosts (good for local dev)

  # Traefik-specific settings (only used when type: traefik)
  traefik:
    entryPoints:
      - web
    tls: {}
    #  secretName: k8s-stack-manager-tls
    middlewares:
      stripApiPrefix: false  # Backend routes include /api prefix (/api/v1/...)
      secureHeaders: true

  # Standard Ingress settings (only used when type: ingress)
  className: ""  # e.g. "nginx", "traefik", or leave empty for cluster default
  tls: []
  #  - secretName: k8s-stack-manager-tls
  #    hosts:
  #      - k8s-stack-manager.local
  annotations: {}
  #  nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #  nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

# ---------------------------------------------------------------------------
# Prometheus Metrics
# ---------------------------------------------------------------------------
metrics:
  enabled: false
  port: 9090
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
