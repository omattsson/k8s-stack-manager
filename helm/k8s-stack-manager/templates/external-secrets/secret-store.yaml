{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.secretStore.create }}
{{- if ne .Values.externalSecrets.secretStore.kind "SecretStore" }}
{{- fail "externalSecrets.secretStore.kind must be SecretStore when externalSecrets.secretStore.create=true" }}
{{- end }}
{{- if and (eq .Values.externalSecrets.azureKeyVault.authType "WorkloadIdentity") (not .Values.backend.serviceAccount.create) }}
{{- fail "backend.serviceAccount.create must be true when creating a WorkloadIdentity SecretStore" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ default (printf "%s-azure-key-vault" (include "k8s-stack-manager.fullname" .)) .Values.externalSecrets.secretStore.name }}
  labels:
    {{- include "k8s-stack-manager.labels" . | nindent 4 }}
spec:
  provider:
    azurekv:
      authType: {{ .Values.externalSecrets.azureKeyVault.authType }}
      vaultUrl: {{ required "externalSecrets.azureKeyVault.vaultUrl must be set when externalSecrets.enabled=true" .Values.externalSecrets.azureKeyVault.vaultUrl | quote }}
      tenantId: {{ required "externalSecrets.azureKeyVault.tenantId must be set when externalSecrets.enabled=true" .Values.externalSecrets.azureKeyVault.tenantId | quote }}
      {{- if eq .Values.externalSecrets.azureKeyVault.authType "WorkloadIdentity" }}
      serviceAccountRef:
        name: {{ include "k8s-stack-manager.fullname" . }}-backend
      {{- else if eq .Values.externalSecrets.azureKeyVault.authType "ServicePrincipal" }}
      authSecretRef:
        clientId:
          name: {{ required "externalSecrets.azureKeyVault.servicePrincipal.secretName must be set when using ServicePrincipal" .Values.externalSecrets.azureKeyVault.servicePrincipal.secretName }}
          key: {{ .Values.externalSecrets.azureKeyVault.servicePrincipal.clientIdKey }}
        clientSecret:
          name: {{ required "externalSecrets.azureKeyVault.servicePrincipal.secretName must be set when using ServicePrincipal" .Values.externalSecrets.azureKeyVault.servicePrincipal.secretName }}
          key: {{ .Values.externalSecrets.azureKeyVault.servicePrincipal.clientSecretKey }}
      {{- else }}
      {{- fail "externalSecrets.azureKeyVault.authType must be WorkloadIdentity or ServicePrincipal" }}
      {{- end }}
{{- end }}