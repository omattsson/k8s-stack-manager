{{- if .Values.externalSecrets.enabled }}
{{- if not .Values.externalSecrets.data }}
{{- fail "externalSecrets.data must contain at least one Key Vault secret mapping when externalSecrets.enabled=true" }}
{{- end }}
{{- $secretMappings := dict }}
{{- range $mapping := .Values.externalSecrets.data }}
{{- $secretKey := required "externalSecrets.data[].secretKey must be set when externalSecrets.enabled=true" $mapping.secretKey }}
{{- if hasKey $secretMappings $secretKey }}
{{- fail (printf "externalSecrets.data contains duplicate secretKey %q" $secretKey) }}
{{- end }}
{{- $_ := set $secretMappings $secretKey true }}
{{- $_ := required (printf "externalSecrets.data[%s].remoteRef.key must be set when externalSecrets.enabled=true" $secretKey) $mapping.remoteRef.key }}
{{- end }}
{{- if not (hasKey $secretMappings "JWT_SECRET") }}
{{- fail "externalSecrets.data must include a JWT_SECRET mapping when externalSecrets.enabled=true" }}
{{- end }}
{{- if and .Values.mysql.enabled (not (hasKey $secretMappings "DB_PASSWORD")) }}
{{- fail "externalSecrets.data must include a DB_PASSWORD mapping when externalSecrets.enabled=true and mysql.enabled=true" }}
{{- end }}
{{- if and .Values.mysql.enabled (not (hasKey $secretMappings "MYSQL_ROOT_PASSWORD")) }}
{{- fail "externalSecrets.data must include a MYSQL_ROOT_PASSWORD mapping when externalSecrets.enabled=true and mysql.enabled=true" }}
{{- end }}
{{- if and .Values.mysql.enabled .Values.mysql.auth.user (not (hasKey $secretMappings "MYSQL_PASSWORD")) }}
{{- fail "externalSecrets.data must include a MYSQL_PASSWORD mapping when externalSecrets.enabled=true, mysql.enabled=true, and mysql.auth.user is non-empty" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "k8s-stack-manager.fullname" . }}-backend
  labels:
    {{- include "k8s-stack-manager.backend.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStore.kind }}
    name: {{ default (printf "%s-azure-key-vault" (include "k8s-stack-manager.fullname" .)) .Values.externalSecrets.secretStore.name }}
  target:
    name: {{ include "k8s-stack-manager.fullname" . }}-backend
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.data }}
    {{- if and (ne .secretKey "MYSQL_ROOT_PASSWORD") (ne .secretKey "MYSQL_PASSWORD") }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        {{- toYaml .remoteRef | nindent 8 }}
    {{- end }}
    {{- end }}
{{- if .Values.mysql.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "k8s-stack-manager.mysql.serviceName" . }}
  labels:
    {{- include "k8s-stack-manager.mysql.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStore.kind }}
    name: {{ default (printf "%s-azure-key-vault" (include "k8s-stack-manager.fullname" .)) .Values.externalSecrets.secretStore.name }}
  target:
    name: {{ include "k8s-stack-manager.mysql.serviceName" . }}
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.data }}
    {{- if or (eq .secretKey "MYSQL_ROOT_PASSWORD") (and $.Values.mysql.auth.user (eq .secretKey "MYSQL_PASSWORD")) }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        {{- toYaml .remoteRef | nindent 8 }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}