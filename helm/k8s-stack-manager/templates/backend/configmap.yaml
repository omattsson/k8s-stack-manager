apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "k8s-stack-manager.fullname" . }}-backend
  labels:
    {{- include "k8s-stack-manager.backend.labels" . | nindent 4 }}
  annotations:
    config.kubernetes.io/description: "Non-sensitive configuration only. Secrets are in the corresponding Secret resource."
data:
  {{- range $key, $value := .Values.backend.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- /* Secure refresh-token cookie behind TLS; an explicit backend.env.SECURE_COOKIES (also "false") wins. */}}
  {{- if and (not (hasKey .Values.backend.env "SECURE_COOKIES")) (eq (include "k8s-stack-manager.ingressTLSEnabled" .) "true") }}
  SECURE_COOKIES: "true"
  {{- end }}
  {{- if .Values.mysql.enabled }}
  DB_HOST: {{ include "k8s-stack-manager.mysql.serviceName" . | quote }}
  DB_PORT: "3306"
  DB_USER: {{ if .Values.mysql.auth.user }}{{ .Values.mysql.auth.user | quote }}{{ else }}"root"{{ end }}
  DB_NAME: {{ .Values.mysql.auth.database | quote }}
  DB_MAX_OPEN_CONNS: "25"
  DB_MAX_IDLE_CONNS: "5"
  DB_CONN_MAX_LIFETIME: "5m"
  {{- end }}
  {{- /* Leader election: one replica runs the background workers. An explicit backend.env value wins. */}}
  {{- if not (hasKey .Values.backend.env "LEADER_ELECTION_ENABLED") }}
  LEADER_ELECTION_ENABLED: {{ .Values.backend.leaderElection.enabled | toString | quote }}
  {{- end }}
  {{- if not (hasKey .Values.backend.env "LEADER_ELECTION_LEASE_NAME") }}
  LEADER_ELECTION_LEASE_NAME: {{ include "k8s-stack-manager.leaderElection.leaseName" . | quote }}
  {{- end }}
  {{- /* WebSocket fan-out: replicas share WebSocket messages through the ws_events table. An explicit backend.env value wins. */}}
  {{- if not (hasKey .Values.backend.env "WS_FANOUT_ENABLED") }}
  WS_FANOUT_ENABLED: {{ .Values.backend.wsFanout.enabled | toString | quote }}
  {{- end }}
  {{- if not (hasKey .Values.backend.env "WS_FANOUT_POLL_INTERVAL") }}
  WS_FANOUT_POLL_INTERVAL: {{ .Values.backend.wsFanout.pollInterval | quote }}
  {{- end }}
  {{- if not (hasKey .Values.backend.env "WS_FANOUT_RETENTION") }}
  WS_FANOUT_RETENTION: {{ .Values.backend.wsFanout.retention | quote }}
  {{- end }}
  {{- /* Branding (web UI title, logo, favicon). An explicit backend.env value wins. */}}
  {{- with .Values.branding }}
  {{- if and .title (not (hasKey $.Values.backend.env "APP_TITLE")) }}
  APP_TITLE: {{ .title | quote }}
  {{- end }}
  {{- if and .logoUrl (not (hasKey $.Values.backend.env "APP_LOGO_URL")) }}
  APP_LOGO_URL: {{ .logoUrl | quote }}
  {{- end }}
  {{- if and .faviconUrl (not (hasKey $.Values.backend.env "APP_FAVICON_URL")) }}
  APP_FAVICON_URL: {{ .faviconUrl | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.hooks.enabled }}
  HOOKS_CONFIG_FILE: "/etc/hooks/hooks.json"
  {{- end }}
  {{- if .Values.backend.namespaceRoleBindings }}
  # NAMESPACE_ROLE_BINDINGS_JSON — list of RoleBinding specs the deployer
  # applies to every stack namespace at pre-install time. Lets a centrally
  # deployed add-on (e.g. a refresh-db service in its own namespace) do work
  # inside each stack namespace without needing cluster-wide RBAC. Schema:
  # backend/internal/deployer/manager.go NamespaceRoleBindingSpec
  # (clusterRole, serviceAccountName, serviceAccountNamespace, optional
  # roleBindingName).
  NAMESPACE_ROLE_BINDINGS_JSON: {{ .Values.backend.namespaceRoleBindings | toJson | quote }}
  {{- end }}
  {{- /* Extra labels on every stack namespace: sorted key=value pairs. An explicit backend.env value wins. */}}
  {{- with .Values.backend.namespaceLabels }}
  {{- range $reserved := list "managed-by" "k8s-stack-manager.io/instance-name" }}
  {{- if hasKey $.Values.backend.namespaceLabels $reserved }}
  {{- fail (printf "backend.namespaceLabels: the key %s is reserved (the backend sets it on every stack namespace)" $reserved) }}
  {{- end }}
  {{- end }}
  {{- if not (hasKey $.Values.backend.env "NAMESPACE_LABELS") }}
  {{- $pairs := list }}
  {{- range $k := keys . | sortAlpha }}
  {{- $pairs = append $pairs (printf "%s=%s" $k (index $.Values.backend.namespaceLabels $k | toString)) }}
  {{- end }}
  NAMESPACE_LABELS: {{ join "," $pairs | quote }}
  {{- end }}
  {{- end }}
  {{- /* Namespace-scoped access of the backend (backend.rbac.scope=namespace). */}}
  {{- if and .Values.backend.serviceAccount.create (eq (.Values.backend.rbac.scope | default "namespace") "namespace") }}
  STACK_ACCESS_CLUSTER_ROLE: {{ printf "%s-stack-access" (include "k8s-stack-manager.fullname" .) | quote }}
  STACK_ACCESS_SERVICE_ACCOUNT: {{ printf "%s/%s-backend" .Release.Namespace (include "k8s-stack-manager.fullname" .) | quote }}
  {{- end }}
  {{- /* Chart repository allowlist. An explicit backend.env value wins. */}}
  {{- if and .Values.backend.allowedChartRepos (not (hasKey .Values.backend.env "ALLOWED_CHART_REPOS")) }}
  ALLOWED_CHART_REPOS: {{ join "," .Values.backend.allowedChartRepos | quote }}
  {{- end }}
  {{- if .Values.metrics.enabled }}
  METRICS_ENABLED: "true"
  METRICS_ADDR: ":{{ .Values.metrics.port }}"
  {{- end }}
  {{- if .Values.otel.enabled }}
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "{{ include "k8s-stack-manager.otel.serviceName" . }}:4317"
  OTEL_SERVICE_NAME: "k8s-stack-manager"
  OTEL_TRACE_SAMPLE_RATE: {{ .Values.otel.sampleRate | quote }}
  {{- end }}
