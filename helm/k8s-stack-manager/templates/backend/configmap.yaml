apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "k8s-stack-manager.fullname" . }}-backend
  labels:
    {{- include "k8s-stack-manager.backend.labels" . | nindent 4 }}
  annotations:
    config.kubernetes.io/description: "Non-sensitive configuration only. Secrets are in the corresponding Secret resource."
data:
  {{- range $key, $value := .Values.backend.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- /* Secure refresh-token cookie behind TLS; an explicit backend.env.SECURE_COOKIES (also "false") wins. */}}
  {{- if and (not (hasKey .Values.backend.env "SECURE_COOKIES")) (eq (include "k8s-stack-manager.ingressTLSEnabled" .) "true") }}
  SECURE_COOKIES: "true"
  {{- end }}
  {{- /* Public https URL of the web UI (links in notification cards); an explicit backend.env.APP_PUBLIC_URL wins. */}}
  {{- if and (not (hasKey .Values.backend.env "APP_PUBLIC_URL")) .Values.ingress.host (eq (include "k8s-stack-manager.ingressTLSEnabled" .) "true") }}
  APP_PUBLIC_URL: {{ printf "https://%s" .Values.ingress.host | quote }}
  {{- end }}
  {{- if .Values.mysql.enabled }}
  DB_HOST: {{ include "k8s-stack-manager.mysql.serviceName" . | quote }}
  DB_PORT: "3306"
  DB_USER: {{ if .Values.mysql.auth.user }}{{ .Values.mysql.auth.user | quote }}{{ else }}"root"{{ end }}
  DB_NAME: {{ .Values.mysql.auth.database | quote }}
  {{- /* Pool defaults; an explicit backend.env value wins. Keep replicas x DB_MAX_OPEN_CONNS below mysql max_connections. */}}
  {{- if not (hasKey .Values.backend.env "DB_MAX_OPEN_CONNS") }}
  DB_MAX_OPEN_CONNS: "25"
  {{- end }}
  {{- if not (hasKey .Values.backend.env "DB_MAX_IDLE_CONNS") }}
  DB_MAX_IDLE_CONNS: "25"
  {{- end }}
  {{- if not (hasKey .Values.backend.env "DB_CONN_MAX_LIFETIME") }}
  DB_CONN_MAX_LIFETIME: "5m"
  {{- end }}
  {{- end }}
  {{- /* Leader election: one replica runs the background workers. An explicit backend.env value wins. */}}
  {{- if not (hasKey .Values.backend.env "LEADER_ELECTION_ENABLED") }}
  LEADER_ELECTION_ENABLED: {{ .Values.backend.leaderElection.enabled | toString | quote }}
  {{- end }}
  {{- if not (hasKey .Values.backend.env "LEADER_ELECTION_LEASE_NAME") }}
  LEADER_ELECTION_LEASE_NAME: {{ include "k8s-stack-manager.leaderElection.leaseName" . | quote }}
  {{- end }}
  {{- /* WebSocket fan-out: replicas share WebSocket messages through the ws_events table. An explicit backend.env value wins. */}}
  {{- if not (hasKey .Values.backend.env "WS_FANOUT_ENABLED") }}
  WS_FANOUT_ENABLED: {{ .Values.backend.wsFanout.enabled | toString | quote }}
  {{- end }}
  {{- if not (hasKey .Values.backend.env "WS_FANOUT_POLL_INTERVAL") }}
  WS_FANOUT_POLL_INTERVAL: {{ .Values.backend.wsFanout.pollInterval | quote }}
  {{- end }}
  {{- if not (hasKey .Values.backend.env "WS_FANOUT_RETENTION") }}
  WS_FANOUT_RETENTION: {{ .Values.backend.wsFanout.retention | quote }}
  {{- end }}
  {{- /* Log retention of the log tables (leader worker log-retention). An explicit backend.env value wins. The raw value goes to the backend, which refuses a value that is not a whole number. */}}
  {{- with .Values.backend.logRetention }}
  {{- if not (hasKey $.Values.backend.env "DEPLOY_LOG_RETENTION_DAYS") }}
  DEPLOY_LOG_RETENTION_DAYS: {{ .deployLogDays | toString | quote }}
  {{- end }}
  {{- if not (hasKey $.Values.backend.env "AUDIT_LOG_RETENTION_DAYS") }}
  AUDIT_LOG_RETENTION_DAYS: {{ .auditLogDays | toString | quote }}
  {{- end }}
  {{- if not (hasKey $.Values.backend.env "NOTIFICATION_RETENTION_DAYS") }}
  NOTIFICATION_RETENTION_DAYS: {{ .notificationDays | toString | quote }}
  {{- end }}
  {{- if not (hasKey $.Values.backend.env "DELIVERY_LOG_RETENTION_DAYS") }}
  DELIVERY_LOG_RETENTION_DAYS: {{ .deliveryLogDays | toString | quote }}
  {{- end }}
  {{- /* hasKey: an old values file without actionRunDays keeps the backend default. */}}
  {{- if and (hasKey . "actionRunDays") (not (hasKey $.Values.backend.env "ACTION_RUN_RETENTION_DAYS")) }}
  ACTION_RUN_RETENTION_DAYS: {{ .actionRunDays | toString | quote }}
  {{- end }}
  {{- if not (hasKey $.Values.backend.env "LOG_RETENTION_INTERVAL") }}
  LOG_RETENTION_INTERVAL: {{ .interval | quote }}
  {{- end }}
  {{- end }}
  {{- /* Port-forward and stream settings. An explicit backend.env value wins. */}}
  {{- with .Values.backend.portForward }}
  {{- if not (hasKey $.Values.backend.env "STACK_PORT_FORWARD_ENABLED") }}
  STACK_PORT_FORWARD_ENABLED: {{ .enabled | toString | quote }}
  {{- end }}
  {{- if not (hasKey $.Values.backend.env "STACK_PORT_FORWARD_MAX_DURATION") }}
  STACK_PORT_FORWARD_MAX_DURATION: {{ .maxDuration | toString | quote }}
  {{- end }}
  {{- if not (hasKey $.Values.backend.env "STACK_PORT_FORWARD_IDLE_TIMEOUT") }}
  STACK_PORT_FORWARD_IDLE_TIMEOUT: {{ .idleTimeout | toString | quote }}
  {{- end }}
  {{- if not (hasKey $.Values.backend.env "STACK_PORT_FORWARD_MAX_PER_USER") }}
  STACK_PORT_FORWARD_MAX_PER_USER: {{ .maxPerUser | toString | quote }}
  {{- end }}
  {{- end }}
  {{- if not (hasKey .Values.backend.env "STACK_STREAM_ALLOW_API_KEYS") }}
  STACK_STREAM_ALLOW_API_KEYS: {{ .Values.backend.streams.allowApiKeys | toString | quote }}
  {{- end }}
  {{- /* Branding (web UI title, logo, favicon). An explicit backend.env value wins. */}}
  {{- with .Values.branding }}
  {{- if and .title (not (hasKey $.Values.backend.env "APP_TITLE")) }}
  APP_TITLE: {{ .title | quote }}
  {{- end }}
  {{- if and .logoUrl (not (hasKey $.Values.backend.env "APP_LOGO_URL")) }}
  APP_LOGO_URL: {{ .logoUrl | quote }}
  {{- end }}
  {{- if and .faviconUrl (not (hasKey $.Values.backend.env "APP_FAVICON_URL")) }}
  APP_FAVICON_URL: {{ .faviconUrl | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.hooks.enabled }}
  HOOKS_CONFIG_FILE: "/etc/hooks/hooks.json"
  {{- end }}
  {{- if .Values.backend.namespaceRoleBindings }}
  # NAMESPACE_ROLE_BINDINGS_JSON — list of RoleBinding specs the deployer
  # applies to every stack namespace at pre-install time. Lets a centrally
  # deployed add-on (e.g. a refresh-db service in its own namespace) do work
  # inside each stack namespace without needing cluster-wide RBAC. Schema:
  # backend/internal/deployer/manager.go NamespaceRoleBindingSpec
  # (clusterRole, serviceAccountName, serviceAccountNamespace, optional
  # roleBindingName).
  NAMESPACE_ROLE_BINDINGS_JSON: {{ .Values.backend.namespaceRoleBindings | toJson | quote }}
  {{- end }}
  {{- /* Extra labels on every stack namespace: sorted key=value pairs. An explicit backend.env value wins. */}}
  {{- with .Values.backend.namespaceLabels }}
  {{- range $reserved := list "managed-by" "k8s-stack-manager.io/instance-name" }}
  {{- if hasKey $.Values.backend.namespaceLabels $reserved }}
  {{- fail (printf "backend.namespaceLabels: the key %s is reserved (the backend sets it on every stack namespace)" $reserved) }}
  {{- end }}
  {{- end }}
  {{- if not (hasKey $.Values.backend.env "NAMESPACE_LABELS") }}
  {{- $pairs := list }}
  {{- range $k := keys . | sortAlpha }}
  {{- $pairs = append $pairs (printf "%s=%s" $k (index $.Values.backend.namespaceLabels $k | toString)) }}
  {{- end }}
  NAMESPACE_LABELS: {{ join "," $pairs | quote }}
  {{- end }}
  {{- end }}
  {{- /* Namespace-scoped access of the backend (backend.rbac.scope=namespace). */}}
  {{- if and .Values.backend.serviceAccount.create (eq (.Values.backend.rbac.scope | default "namespace") "namespace") }}
  STACK_ACCESS_CLUSTER_ROLE: {{ printf "%s-stack-access" (include "k8s-stack-manager.fullname" .) | quote }}
  STACK_ACCESS_SERVICE_ACCOUNT: {{ printf "%s/%s-backend" .Release.Namespace (include "k8s-stack-manager.fullname" .) | quote }}
  {{- end }}
  {{- /* Chart repository allowlist. An explicit backend.env value wins. */}}
  {{- if and .Values.backend.allowedChartRepos (not (hasKey .Values.backend.env "ALLOWED_CHART_REPOS")) }}
  ALLOWED_CHART_REPOS: {{ join "," .Values.backend.allowedChartRepos | quote }}
  {{- end }}
  {{- /* Trusted proxies for the client IP. An explicit backend.env value wins. */}}
  {{- if and .Values.backend.trustedProxies (not (hasKey .Values.backend.env "TRUSTED_PROXIES")) }}
  TRUSTED_PROXIES: {{ join "," .Values.backend.trustedProxies | quote }}
  {{- end }}
  {{- /* Unique instance names for each cluster. An explicit backend.env value wins. */}}
  {{- if and .Values.backend.uniqueInstanceNames (not (hasKey .Values.backend.env "UNIQUE_INSTANCE_NAMES")) }}
  UNIQUE_INSTANCE_NAMES: "true"
  {{- end }}
  {{- /* Maximum TTL in days (1 to 365). An explicit backend.env value wins. */}}
  {{- if not (hasKey .Values.backend.env "MAX_INSTANCE_TTL_DAYS") }}
  {{- $maxTtlDays := .Values.backend.maxInstanceTtlDays }}
  {{- if kindIs "invalid" $maxTtlDays }}{{- $maxTtlDays = 30 }}{{- end }}
  {{- if or (not (regexMatch "^[0-9]+$" (toString $maxTtlDays))) (lt (int $maxTtlDays) 1) (gt (int $maxTtlDays) 365) }}
  {{- fail (printf "backend.maxInstanceTtlDays must be a whole number from 1 to 365, got %v" $maxTtlDays) }}
  {{- end }}
  {{- /* The TTL default must fit the limit, or every create gives 400. */}}
  {{- $defaultTtl := toString (index .Values.backend.env "DEFAULT_INSTANCE_TTL_MINUTES" | default "0") }}
  {{- if and (regexMatch "^[0-9]+$" $defaultTtl) (gt (atoi $defaultTtl) (mul (int $maxTtlDays) 1440)) }}
  {{- fail (printf "backend.env.DEFAULT_INSTANCE_TTL_MINUTES (%s) must not exceed backend.maxInstanceTtlDays (%v days)" $defaultTtl $maxTtlDays) }}
  {{- end }}
  MAX_INSTANCE_TTL_DAYS: {{ $maxTtlDays | toString | quote }}
  {{- end }}
  {{- /* Helm revisions kept for each release (2 or more). Rendered only when set: unset keeps the Helm default (10). An explicit backend.env value wins. */}}
  {{- $historyMax := .Values.backend.helmHistoryMax }}
  {{- if and (not (kindIs "invalid" $historyMax)) (ne (trim (toString $historyMax)) "") (not (hasKey .Values.backend.env "HELM_HISTORY_MAX")) }}
  {{- /* A number from a values file or --set-json is a float64, and toString writes 1e+06 from one million on: convert a whole number to int64 first. */}}
  {{- $historyMaxText := trim (toString $historyMax) }}
  {{- if and (kindIs "float64" $historyMax) (eq (float64 (int64 $historyMax)) $historyMax) }}
  {{- $historyMaxText = toString (int64 $historyMax) }}
  {{- end }}
  {{- if or (not (regexMatch "^[0-9]+$" $historyMaxText)) (lt (atoi $historyMaxText) 2) }}
  {{- fail (printf "backend.helmHistoryMax must be a whole number of 2 or more, got %v" $historyMax) }}
  {{- end }}
  HELM_HISTORY_MAX: {{ $historyMaxText | quote }}
  {{- end }}
  {{- if .Values.metrics.enabled }}
  METRICS_ENABLED: "true"
  METRICS_ADDR: ":{{ .Values.metrics.port }}"
  {{- end }}
  {{- if .Values.otel.enabled }}
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "{{ include "k8s-stack-manager.otel.serviceName" . }}:4317"
  OTEL_SERVICE_NAME: "k8s-stack-manager"
  OTEL_TRACE_SAMPLE_RATE: {{ .Values.otel.sampleRate | quote }}
  {{- end }}
