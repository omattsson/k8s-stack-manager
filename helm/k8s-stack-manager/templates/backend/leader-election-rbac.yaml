{{- if and .Values.backend.leaderElection.enabled .Values.backend.serviceAccount.create }}
{{- $leaseName := include "k8s-stack-manager.leaderElection.leaseName" . }}
# Leader election: the backend replicas compete for one coordination.k8s.io
# Lease in the release namespace. Only the leader runs the background workers.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8s-stack-manager.fullname" . }}-backend-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-stack-manager.backend.labels" . | nindent 4 }}
rules:
  # create cannot be limited to a resource name.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ $leaseName | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k8s-stack-manager.fullname" . }}-backend-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-stack-manager.backend.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "k8s-stack-manager.fullname" . }}-backend-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-stack-manager.fullname" . }}-backend
    namespace: {{ .Release.Namespace }}
{{- end }}
