{{- if and .Values.frontend.enabled (include "k8s-stack-manager.brandingFilesEnabled" .) }}
{{- include "k8s-stack-manager.validateBrandingFiles" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "k8s-stack-manager.fullname" . }}-frontend-branding
  labels:
    {{- include "k8s-stack-manager.frontend.labels" . | nindent 4 }}
{{- with .Values.branding.files }}
data:
  {{- range $name, $content := . }}
  {{ $name | quote }}: {{ $content | quote }}
  {{- end }}
{{- end }}
{{- with .Values.branding.binaryFiles }}
binaryData:
  {{- range $name, $content := . }}
  {{ $name | quote }}: {{ $content | quote }}
  {{- end }}
{{- end }}
{{- end }}
