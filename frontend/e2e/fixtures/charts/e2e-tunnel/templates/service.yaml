apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    # Service port 80 -> the named container port http (8080): the backend
    # resolves the name like kubectl port-forward svc/web.
    - name: http
      port: 80
      targetPort: http
