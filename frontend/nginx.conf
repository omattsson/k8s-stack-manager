server {
    listen 8080;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Stream routes (port-forward and exec): a WebSocket upgrade on a path
    # under /api. A regex location wins over the prefix location /api/ below,
    # which removes the Upgrade header. The URI is passed as is, so the /api
    # prefix stays. The timeouts must cover the longest tunnel: the backend
    # closes a tunnel at STACK_PORT_FORWARD_MAX_DURATION (default 1h), so
    # 3700s is the 1h default plus margin. An operator who raises
    # STACK_PORT_FORWARD_MAX_DURATION must raise these two values too, or nginx
    # cuts a tunnel before the backend does. Auth is the Authorization or
    # X-API-Key header, which nginx passes on.
    location ~ ^/api/v1/stack-instances/[^/]+/(port-forward|exec)$ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # $http_host keeps the port (localhost:3000), so the backend sees the
        # same host as the Origin header of the web UI (origin check).
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        # $http_host keeps the port (localhost:3000), so the backend sees the
        # same host as the Origin header of the web UI (CORS same-origin check).
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy WebSocket connections
    location /ws {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # $http_host keeps the port (localhost:3000), so the backend sees the
        # same host as the Origin header of the web UI (CORS same-origin check).
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }
}
