global:
  scrape_interval: 15s

scrape_configs:
  # Application metrics via OTel Collector's Prometheus exporter
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # Backend Prometheus endpoint (METRICS_ENABLED=true in docker-compose.otel.yml).
  # The K8s Stack Manager dashboard uses this job.
  - job_name: 'k8s-stack-manager-backend'
    static_configs:
      - targets: ['backend:9090']

  # OTel Collector internal metrics
  - job_name: 'otel-collector-internal'
    static_configs:
      - targets: ['otel-collector:8888']

  # Tempo internal metrics
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']

  # Grafana internal metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # Prometheus self-scrape
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # MySQL server metrics via mysqld-exporter
  - job_name: 'mysqld-exporter'
    static_configs:
      - targets: ['mysqld-exporter:9104']
